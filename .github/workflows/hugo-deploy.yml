name: Deploy Hugo Site to GitHub Pages

on:
  push:
    branches:
      - main  # 当推送到 main 分支时触发，如果你的主分支是 master，请改为 master

  # 允许手动触发工作流
  workflow_dispatch:

# 设置权限，允许部署到 gh-pages 分支
permissions:
  contents: read
  pages: write
  id-token: write

# 并发控制，避免多个部署任务冲突
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 构建任务
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
        with:
          submodules: recursive  # 如果主题是 Git 子模块，需要递归拉取
          fetch-depth: 0

      - name: 安装 Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.134.1'  # 建议指定具体版本，也可以用 'latest'
          extended: true           # 如果使用 SCSS/SASS，必须启用 extended 版本

      - name: 构建网站
        run: hugo --minify --baseURL "https://jsonxcel.github.io/learn-jsonxcel/"

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # 部署任务
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4