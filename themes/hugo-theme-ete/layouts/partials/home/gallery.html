<section id="gallery" class="border-b border-slate-200 bg-surface py-20 dark:border-slate-800 dark:bg-slate-950" x-data="{ active: 0 }">
  <div class="container-ete">
    <div class="mx-auto max-w-2xl text-center">
      <h2 class="font-display text-3xl font-bold tracking-tight dark:text-white">{{ i18n "gallery_title" }}</h2>
      <p class="mt-3 text-ink-muted dark:text-slate-400">{{ i18n "gallery_subtitle" }}</p>
    </div>
    <div class="mt-10 overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-soft dark:border-slate-700 dark:bg-slate-900">
      <div class="flex border-b border-slate-200 dark:border-slate-700">
        {{ range $i, $item := hugo.Data.home.gallery }}
          <button
            type="button"
            class="flex-1 px-4 py-3 text-sm font-medium transition"
            :class="active === {{ $i }} ? 'bg-brand-50 text-brand-700 dark:bg-slate-800 dark:text-white' : 'text-ink-muted hover:bg-slate-50 dark:hover:bg-slate-800/60'"
            @click="active = {{ $i }}"
          >{{ i18n (printf "gallery_%s_label" $item.id) }}</button>
        {{ end }}
      </div>
      <div class="p-6 sm:p-8">
        {{ range $i, $item := hugo.Data.home.gallery }}
          <div x-show="active === {{ $i }}" x-cloak>
            <p class="mb-4 text-sm text-ink-muted dark:text-slate-400">{{ i18n (printf "gallery_%s_caption" $item.id) }}</p>
            {{- partial (printf "illustrations/gallery-%s.html" $item.id) $ -}}
          </div>
        {{ end }}
      </div>
    </div>
  </div>
</section>
