<section id="testimonials" class="border-b border-slate-200 bg-surface py-20 dark:border-slate-800 dark:bg-slate-950">
  <div class="container-ete">
    <div class="mx-auto max-w-2xl text-center">
      <h2 class="font-display text-3xl font-bold tracking-tight dark:text-white">{{ i18n "testimonials_title" }}</h2>
      <p class="mt-3 text-ink-muted dark:text-slate-400">{{ i18n "testimonials_subtitle" }}</p>
    </div>
    <div class="mt-12 grid gap-6 md:grid-cols-3">
      {{ range hugo.Data.home.testimonials }}
        <blockquote class="flex h-full flex-col rounded-2xl border border-slate-200 bg-white p-6 dark:border-slate-800 dark:bg-slate-900">
          <p class="flex-1 text-sm leading-relaxed text-ink dark:text-slate-200">“{{ i18n (printf "testimonial_%s_quote" .id) }}”</p>
          <footer class="mt-6 border-t border-slate-100 pt-4 dark:border-slate-800">
            <p class="text-sm font-semibold text-ink dark:text-white">{{ i18n (printf "testimonial_%s_name" .id) }}</p>
            <p class="text-xs text-ink-muted dark:text-slate-400">{{ i18n (printf "testimonial_%s_role" .id) }}</p>
          </footer>
        </blockquote>
      {{ end }}
    </div>
  </div>
</section>
