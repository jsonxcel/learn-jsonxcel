<section id="features" class="border-b border-slate-200 bg-surface py-20 dark:border-slate-800 dark:bg-slate-950">
  <div class="container-ete">
    <div class="mx-auto max-w-2xl text-center">
      <h2 class="font-display text-3xl font-bold tracking-tight dark:text-white">{{ i18n "features_title" }}</h2>
      <p class="mt-3 text-ink-muted dark:text-slate-400">{{ i18n "features_subtitle" }}</p>
    </div>
    <div class="mt-14 grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
      {{ range hugo.Data.home.features }}
        <article class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900">
          <div class="mb-4 inline-flex h-10 w-10 items-center justify-center rounded-lg bg-brand-50 text-brand-700 dark:bg-slate-800 dark:text-brand-100">
            {{- partial (printf "illustrations/icon-%s.html" .id) . -}}
          </div>
          <h3 class="font-display text-lg font-semibold text-ink dark:text-white">
            {{ i18n (printf "feature_%s_title" .id) }}
          </h3>
          <p class="mt-2 text-sm leading-relaxed text-ink-muted dark:text-slate-400">
            {{ i18n (printf "feature_%s_body" .id) }}
          </p>
        </article>
      {{ end }}
    </div>
  </div>
</section>
