<section id="faq" class="border-b border-slate-200 bg-white py-20 dark:border-slate-800 dark:bg-slate-950">
  <div class="container-ete max-w-3xl">
    <div class="text-center">
      <h2 class="font-display text-3xl font-bold tracking-tight dark:text-white">{{ i18n "faq_title" }}</h2>
      <p class="mt-3 text-ink-muted dark:text-slate-400">{{ i18n "faq_subtitle" }}</p>
    </div>
    <div class="mt-10 divide-y divide-slate-200 rounded-2xl border border-slate-200 dark:divide-slate-800 dark:border-slate-700" x-data="{ open: 0 }">
      {{ range $i, $item := hugo.Data.home.faq }}
        <div class="px-5">
          <button
            type="button"
            class="flex w-full items-center justify-between gap-4 py-4 text-left"
            @click="open = open === {{ $i }} ? -1 : {{ $i }}"
            :aria-expanded="(open === {{ $i }}).toString()"
          >
            <span class="font-semibold text-ink dark:text-white">{{ i18n (printf "faq_%s_q" $item.id) }}</span>
            <span class="text-ink-muted" x-text="open === {{ $i }} ? '-' : '+'"></span>
          </button>
          <div class="pb-4 text-sm leading-relaxed text-ink-muted dark:text-slate-400" x-show="open === {{ $i }}" x-cloak>
            {{ i18n (printf "faq_%s_a" $item.id) }}
          </div>
        </div>
      {{ end }}
    </div>
  </div>
</section>
