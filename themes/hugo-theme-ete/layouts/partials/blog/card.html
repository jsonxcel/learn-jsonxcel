<article class="blog-card">
  <a class="blog-card__link" href="{{ .RelPermalink }}">
    <h2 class="blog-card__title">{{ .Title }}</h2>
  </a>
  {{ with .Description }}
    <p class="blog-card__excerpt">{{ . }}</p>
  {{ else }}
    <p class="blog-card__excerpt">{{ .Summary | plainify | truncate 160 }}</p>
  {{ end }}
  {{- partial "blog/meta.html" . -}}
</article>
