faq_title = "FAQ"
faq_subtitle = "Short answers for evaluators and integrators."
faq_what_q = "What is JsonXcel?"
faq_what_a = "A Web Service that injects JSON data sources into multilingual Excel templates and returns Excel or PDF files."
faq_gcexcel_q = "How does this relate to GCExcel-style templates?"
faq_gcexcel_a = "JsonXcel focuses on the template + JSON + API path for document generation. Tutorials teach that path — not a full SDK encyclopedia."
faq_languages_q = "Which languages are supported for templates?"
faq_languages_a = "At minimum en-US, zh-CN, zh-TW, ja-JP, and ko-KR via Templates/{language}/ folders and the language request field."
faq_selfhost_q = "Can we self-host?"
faq_selfhost_a = "Yes. Run JsonXcel.WebServer in your environment, point templates at your storage directory, and call /api/convert from your apps or the Learn site."
faq_templates_q = "Who creates the Excel templates?"
faq_templates_a = "Anyone comfortable with Excel. Developers define the JSON contract; designers own visual layout and localization."

