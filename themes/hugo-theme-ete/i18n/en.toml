features_title = "Why teams choose JsonXcel"
features_subtitle = "Decouple report layout from application code without giving up API simplicity."
feature_json_templates_title = "JSON meets Excel templates"
feature_json_templates_body = "Designers own the workbook. Services send structured JSON. Markers bind fields without redrawing sheets in code."
feature_multilingual_title = "Five-locale template folders"
feature_multilingual_body = "Same template_name under en-US, zh-CN, zh-TW, ja-JP, and ko-KR. Pass language on each convert call."
feature_one_api_title = "One convert endpoint"
feature_one_api_body = "POST /api/convert with template_name, language, output_format, and ds* data sources — Excel or PDF back."
feature_business_docs_title = "Real business documents"
feature_business_docs_body = "Orders, expenses, budgets, shipping notes — keep formulas, styles, and charts designers already use."
feature_learn_path_title = "Guided learning path"
feature_learn_path_body = "Progressive tutorials from first convert to expansion, filters, and multilingual invoices."
feature_operable_title = "Operable in production"
feature_operable_body = "Scan template folders, enable or disable workbooks, and integrate behind your own auth and rate limits."

arch_title = "Architecture at a glance"
arch_subtitle = "Your systems stay JSON-native. JsonXcel owns template resolution and rendering."
arch_step1_title = "Prepare a workbook template"
arch_step1_body = "Place markers and layout in Excel; store under Templates/{language}/."
arch_step2_title = "Emit business JSON"
arch_step2_body = "ERP, SaaS, or scripts produce ds / ds01 payloads — no cell coordinates in app code."
arch_step3_title = "Call /api/convert"
arch_step3_body = "JsonXcel loads the language-specific template, binds data sources, and runs ProcessTemplate."
arch_step4_title = "Receive Excel or PDF"
arch_step4_body = "Stream the file to users or store metadata (name, size, path) for your workflow."

