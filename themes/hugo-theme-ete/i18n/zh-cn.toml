faq_title = "常见问题"
faq_subtitle = "给评估者与集成方的短答。"
faq_what_q = "JsonXcel 是什么？"
faq_what_a = "一个 Web 服务：把 JSON 数据源注入多语言 Excel 模板，并返回 Excel 或 PDF。"
faq_gcexcel_q = "与 GCExcel 风格模板的关系？"
faq_gcexcel_a = "JsonXcel 聚焦「模板 + JSON + API」的单据生成路径。教程讲这条路径，而不是整本 SDK 百科。"
faq_languages_q = "模板支持哪些语言？"
faq_languages_a = "至少 en-US、zh-CN、zh-TW、ja-JP、ko-KR，通过 Templates/{language}/ 与请求中的 language 字段。"
faq_selfhost_q = "可以私有化部署吗？"
faq_selfhost_a = "可以。运行 JsonXcel.WebServer，指向你的模板目录，从应用或教程站调用 /api/convert。"
faq_templates_q = "谁来做 Excel 模板？"
faq_templates_a = "任何熟悉 Excel 的人。开发者定义 JSON 契约，设计师负责视觉与本地化。"

