features_title = "为什么选择 JsonXcel"
features_subtitle = "让报表版式与应用代码解耦，同时保持 API 足够简单。"
feature_json_templates_title = "JSON 遇上 Excel 模板"
feature_json_templates_body = "设计师维护工作簿，服务只发送结构化 JSON；用标记绑定字段，无需在代码里画表。"
feature_multilingual_title = "五语言模板目录"
feature_multilingual_body = "同一 template_name 位于 en-US / zh-CN / zh-TW / ja-JP / ko-KR。每次转换传入 language。"
feature_one_api_title = "一个 convert 接口"
feature_one_api_body = "POST /api/convert，携带 template_name、language、output_format 与 ds* 数据源，返回 Excel 或 PDF。"
feature_business_docs_title = "真实业务单据"
