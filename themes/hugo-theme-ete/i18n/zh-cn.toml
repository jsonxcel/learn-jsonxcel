feature_learn_path_title = "循序渐进教程"
feature_learn_path_body = "从第一次 convert 到扩展、过滤与多语言发票，路径清晰。"
feature_operable_title = "可上线运营"
feature_operable_body = "扫描模板目录、启用/停用工作簿，并接入自有鉴权与限流。"

