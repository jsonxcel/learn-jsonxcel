features_title = "JsonXcel을 선택하는 이유"
features_subtitle = "API 단순함을 유지하면서 보고서 레이아웃을 앱 코드에서 분리합니다."
feature_json_templates_title = "JSON과 Excel 템플릿"
feature_json_templates_body = "디자이너가 통합 문서를 소유하고, 서비스는 구조화 JSON만 보냅니다. 마커로 필드를 연결하며 코드로 시트를 다시 그리지 않습니다."
feature_multilingual_title = "5개 로케일 템플릿 폴더"
feature_multilingual_body = "동일한 template_name을 en-US / zh-CN / zh-TW / ja-JP / ko-KR에 둡니다. 각 convert에 language를 전달하세요."
feature_one_api_title = "하나의 convert 엔드포인트"
feature_one_api_body = "POST /api/convert에 template_name, language, output_format, ds*를 보내 Excel 또는 PDF를 받습니다."
feature_business_docs_title = "실제 비즈니스 문서"
feature_business_docs_body = "주문, 경비, 예산, 출하 안내 — 디자이너가 쓰는 수식·스타일·차트를 유지합니다."
feature_learn_path_title = "단계적 학습 경로"
feature_learn_path_body = "첫 convert부터 확장, 필터, 다국어 송장까지 진행합니다."
feature_operable_title = "운영 가능한 프로덕션"
feature_operable_body = "템플릿 폴더 스캔, 통합 문서 활성/비활성, 자체 인증·한도 뒤에 통합."

arch_title = "아키텍처 한눈에"
arch_subtitle = "업무 시스템은 JSON 네이티브를 유지합니다. JsonXcel이 템플릿 해석과 렌더링을 담당합니다."
arch_step1_title = "통합 문서 템플릿 준비"
arch_step1_body = "Excel에 마커와 레이아웃을 두고 Templates/{language}/에 저장합니다."
arch_step2_title = "업무 JSON 생성"
arch_step2_body = "ERP / SaaS / 스크립트가 ds / ds01을 만듭니다 — 앱 코드에 셀 좌표 없음."
arch_step3_title = "/api/convert 호출"
arch_step3_body = "JsonXcel이 언어별 템플릿을 로드하고 데이터 소스를 바인딩한 뒤 ProcessTemplate을 실행합니다."
arch_step4_title = "Excel 또는 PDF 수신"
arch_step4_body = "파일을 스트림하거나 이름·크기·경로 메타데이터를 저장합니다."

