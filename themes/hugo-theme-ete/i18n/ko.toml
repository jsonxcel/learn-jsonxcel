faq_title = "FAQ"
faq_subtitle = "평가자·통합 담당자를 위한 짧은 답."
faq_what_q = "JsonXcel이란?"
faq_what_a = "다국어 Excel 템플릿에 JSON 데이터 소스를 주입하고 Excel 또는 PDF를 반환하는 Web Service입니다."
faq_gcexcel_q = "GCExcel 스타일 템플릿과의 관계는?"
faq_gcexcel_a = "JsonXcel은 문서 생성을 위한 템플릿 + JSON + API 경로에 집중합니다. 튜토리얼은 그 경로를 가르치며 SDK 백과가 아닙니다."
faq_languages_q = "템플릿 지원 언어는?"
faq_languages_a = "최소 en-US, zh-CN, zh-TW, ja-JP, ko-KR. Templates/{language}/와 요청의 language 필드로 지정합니다."
faq_selfhost_q = "셀프호스팅할 수 있나요?"
faq_selfhost_a = "가능합니다. 환경에서 JsonXcel.WebServer를 실행하고 템플릿 디렉터리를 가리킨 뒤 앱이나 Learn 사이트에서 /api/convert를 호출하세요."
faq_templates_q = "누가 Excel 템플릿을 만드나요?"
faq_templates_a = "Excel에 익숙한 누구나. 개발자가 JSON 계약을 정의하고, 디자이너가 시각 레이아웃과 현지화를 담당합니다."

