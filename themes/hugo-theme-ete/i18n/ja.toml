faq_title = "FAQ"
faq_subtitle = "評価者・統合担当向けの短い回答。"
faq_what_q = "JsonXcel とは？"
faq_what_a = "多言語 Excel テンプレートに JSON データソースを注入し、Excel または PDF を返す Web サービスです。"
faq_gcexcel_q = "GCExcel 風テンプレートとの関係は？"
faq_gcexcel_a = "JsonXcel は帳票生成のための「テンプレート + JSON + API」に焦点を当てます。チュートリアルはその経路を教え、SDK 百科ではありません。"
faq_languages_q = "テンプレートで使える言語は？"
faq_languages_a = "少なくとも en-US、zh-CN、zh-TW、ja-JP、ko-KR。Templates/{language}/ とリクエストの language フィールドで指定します。"
faq_selfhost_q = "セルフホストできますか？"
faq_selfhost_a = "できます。環境で JsonXcel.WebServer を動かし、テンプレートディレクトリを指し、アプリや Learn サイトから /api/convert を呼び出します。"
faq_templates_q = "誰が Excel テンプレートを作る？"
faq_templates_a = "Excel に慣れた人なら誰でも。開発者が JSON 契約を定義し、デザイナーが見た目とローカライズを担います。"

