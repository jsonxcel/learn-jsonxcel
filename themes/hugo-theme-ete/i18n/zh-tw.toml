faq_title = "常見問題"
faq_subtitle = "給評估者與整合方的短答。"
faq_what_q = "JsonXcel 是什麼？"
faq_what_a = "一個 Web 服務：把 JSON 資料來源注入多語系 Excel 範本，並回傳 Excel 或 PDF。"
faq_gcexcel_q = "與 GCExcel 風格範本的關係？"
faq_gcexcel_a = "JsonXcel 聚焦「範本＋JSON＋API」的單據產生路徑。教程講這條路徑，而不是整本 SDK 百科。"
faq_languages_q = "範本支援哪些語言？"
faq_languages_a = "至少 en-US、zh-CN、zh-TW、ja-JP、ko-KR，透過 Templates/{language}/ 與請求中的 language 欄位。"
faq_selfhost_q = "可以私有化部署嗎？"
faq_selfhost_a = "可以。執行 JsonXcel.WebServer，指向你的範本目錄，從應用或教程站呼叫 /api/convert。"
faq_templates_q = "誰來做 Excel 範本？"
faq_templates_a = "任何熟悉 Excel 的人。開發者定義 JSON 契約，設計師負責視覺與在地化。"

